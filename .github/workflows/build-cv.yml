name: Build CV and Publish PDF

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: CV_annayesy.tex
          working_directory: cv

      - name: Prepare Pages content
        run: |
          rm -rf pages
          mkdir -p pages/cv

          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'cv' \
            ./ pages/

          cp cv/CV_annayesy.pdf pages/cv/CV_annayesy.pdf
          touch pages/.nojekyll

      - name: Publish to gh-pages (orphan branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: pages
          force_orphan: true
