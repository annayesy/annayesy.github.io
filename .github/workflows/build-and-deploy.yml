name: Build LaTeX and Deploy PDF to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX (with bibliography)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: CV_annayesy.tex
          # If you use biblatex/biber, this helps ensure biber is run:
          latexmk_use_xelatex: false
          latexmk_use_lualatex: false
          extra_system_packages: "biber"

      - name: Prepare site
        run: |
          mkdir -p site
          cp resume.pdf site/resume.pdf
          cat > site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=resume.pdf">
          <title>Resume</title>
          <p><a href="resume.pdf">Open resume.pdf</a></p>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
